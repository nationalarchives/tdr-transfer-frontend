name: TDR Tag and pre deploy Transfer Frontend
on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Build a dev snapshot from the current branch instead of the next release version'
        type: boolean
        required: false
        default: false
  push:
    branches:
      - master
permissions: {}
jobs:
  pre-deploy:
    permissions:
      contents: write
      id-token: write
    uses: nationalarchives/tdr-github-actions/.github/workflows/ecs_build.yml@68960904fc1b628f92756d3f760e7ab64cfe95f2 # v0.0.44
    with:
      java-version: '17'
      repo-name: tdr-transfer-frontend
      image-name: transfer-frontend
      snapshot: ${{ inputs.snapshot == true }}
      build-command: |
        sbt dist
    secrets:
      MANAGEMENT_ACCOUNT: ${{ secrets.MANAGEMENT_ACCOUNT }}
      WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
      WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
      WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}
      WIZ_PROJECT_ID: ${{ secrets.WIZ_PROJECT_TDR }}
  deploy:
    needs: pre-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          if [ "$SNAPSHOT" = "true" ]; then
            gh workflow run deploy.yml -f environment=dev -f to-deploy=$NEXT_VERSION
          else
            gh workflow run deploy.yml -f environment=intg -f to-deploy=$NEXT_VERSION
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          NEXT_VERSION: ${{ needs.pre-deploy.outputs.next-version }}
          SNAPSHOT: ${{ inputs.snapshot == true }}

